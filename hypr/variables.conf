# ### Hyprland ###
# Apps
$terminal = foot
$browser = brave
$editor = foot nvim
$fileExplorer = foot ranger
$fileExplorerVisual = thunar

# Touchpad
$touchpadDisableTyping = true
$touchpadScrollFactor = 0.3
$workspaceSwipeFingers = 4
$gestureFingers = 3
$gestureFingersMore = 4

# Blur
$blurEnabled = true
$blurSpecialWs = false
$blurPopups = true
$blurInputMethods = true
$blurSize = 8
$blurPasses = 2
$blurXray = false

# Shadow
$shadowEnabled = true
$shadowRange = 20
$shadowRenderPower = 3
$shadowColour = rgba($surfaced4)

# Gaps
$workspaceGaps = 20
$windowGapsIn = 5
$windowGapsOut = 10
$singleWindowGapsOut = 20

# Window styling
$windowOpacity = 0.95
$windowRounding = 15

$windowBorderSize = 0
$activeWindowBorderColour = rgba($primarye6)
$inactiveWindowBorderColour = rgba($onSurfaceVariant11)

# Misc
$volumeStep = 5 # In percent
$cursorTheme = Sweet-cursors-hyprcursor
$cursorSize = 24


# ### Keybinds ###
# Workspaces
$kbMoveWinToWs = Super+Shift
$kbMoveWinToWsGroup = Ctrl+Super+Alt
$kbGoToWs = Super

$kbNextWs = Ctrl+Super, right
$kbPrevWs = Ctrl+Super, left

$kbToggleSpecialWs = Super+Shift, S

# Window groups
$kbWindowGroupCycleNext = Alt, Tab
$kbWindowGroupCyclePrev = Shift+Alt, Tab
$kbUngroup = Super, U
$kbToggleGroup = Super, Comma

# Window actions
$kbMoveWindow = Super, Z
$kbResizeWindow = Super, X
$kbWindowPip = Super+Alt, Backslash
$kbPinWindow = Super+Alt, P
$kbWindowFullscreen = Super, F
$kbWindowBorderedFullscreen = Super+Alt, F
$kbToggleWindowFloating = Super+Shift, F
$kbCloseWindow = Super, Q

# Special workspace toggles
$kbSystemMonitor = Ctrl+Shift, Escape
$kbMusic = Super, M
$kbCommunication = Super, D
$kbTodo = Super, T
$kbMail = Super, O
$kbTeams = Super, P

# Apps
$kbTerminal = Super, RETURN
$kbBrowser = Super, W
$kbBrowserWork = Super, E
$kbBrowserWork2 = Super+Shift, E
$kbEditor = Super, C
$kbFileExplorer = Super, R
$kbFileExplorerVisual = Super+Shift, R
$kbCalculator = Super, END
$kbChat = Super, Y

# Misc
$kbSession = Super, X
$kbClearNotifs = Ctrl+Alt, C
$kbShowPanels = Super+Alt, K
$kbLock = Super+Shift, L
$kbRestoreLock = Super+Alt, X
